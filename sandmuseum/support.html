    <h1>沙绘博物馆技术支持</h1>
    <h2>怎么取色和收沙？</h2>
    <p>点一只空瓶，再点「取色」，可先指定一种底部可接的颜色。也可以直接拖空瓶，它会锁定接到的第一种颜色。把瓶口拖到沙画底边即可收取同色细沙。满瓶后会自动回到瓶位。</p>
    <h2>卡住了怎么办？</h2>
    <p>试着沿沙画底边向两侧移动瓶口。「提示」会建议可以接取的颜色，「撤回」可恢复上一手。若要从头开始当前关卡，可选择「重铺」。</p>
    <h2>联系开发者</h2>
    <p>请发邮件至 <a href="mailto:yvinus@qq.com">yvinus@qq.com</a>，注明「沙绘博物馆」，并附上设备型号、iOS 版本和重现步骤。</p>
    <footer><p>应用标识 <code>com.sandmuseum.game</code></p></footer>
